set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'egel/tmux-gruvbox'
set -g @tmux-gruvbox 'dark'
set -g @tmux-gruvbox-right-status-x ''
set -g @tmux-gruvbox-right-status-y ''

set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi PageUp send-keys -X page-up
bind-key -T copy-mode-vi PageDown send-keys -X page-down

# ---------------------------------------------------------
# Doom Emacs Window Management (Prefix + w + <key>)
# ---------------------------------------------------------

# Unbind the default 'w' (which opens the window tree)
unbind w

# Bind 'w' to switch to our custom key table
bind w switch-client -T doom_window

# -- Splitting Windows --
# SPC w v : Split vertically (side-by-side)
bind -T doom_window v split-window -h

# SPC w s : Split horizontally (top-and-bottom)
bind -T doom_window s split-window -v

# -- Navigating Windows (Panes) --
# SPC w h/j/k/l : Navigate left/down/up/right
bind -T doom_window h select-pane -L
bind -T doom_window j select-pane -D
bind -T doom_window k select-pane -U
bind -T doom_window l select-pane -R

# -- Closing Windows --
# SPC w q : Close current pane/window
bind -T doom_window q kill-pane

# -- Other Helpful Doom Defaults --
# SPC w = : Balance windows (tiled layout)
bind -T doom_window = select-layout tiled

run '~/.local/share/tmux/plugins/tpm/tpm'
